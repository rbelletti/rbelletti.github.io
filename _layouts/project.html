<style>
/* 1. Rimuove la colonna sinistra (header) su TUTTI i dispositivi */
header {
  display: none !important;
}

/* 2. Regola il contenitore principale per tutti gli schermi */
.wrapper {
  max-width: 860px !important; /* Larghezza massima su desktop */
  width: 100% !important;      /* Si adatta fluidamente sui cellulari */
  margin: 0 auto !important;   /* Centra la pagina lo schermo */
  padding: 20px !important;    /* Evita che il testo tocchi i bordi del telefono */
  box-sizing: border-box !important;
}

/* 3. Allarga l'area del testo a tutto spazio dentro il wrapper */
section {
  width: 100% !important;
  max-width: 100% !important;
  float: none !important;
  padding: 0 !important;
}
</style>
