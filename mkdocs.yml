site_name: Il Tuo Nome - Portfolio
site_url: https://tuoaccount.github.io/

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs

nav:
  - Home: index.md
  - Modal Testing: docs/modal-testing/report.md
  - Vortex Vibrations: docs/vortex-induced-vibrations/report.md
  - Airfoil Analysis: docs/airfoil-analysis/report.md

extra_javascript:
  - docs/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - attr_list

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/tuoprofilo
    - icon: fontawesome/solid/envelope
      link: mailto:la.tua@email.it
    - icon: fontawesome/brands/github
      link: https://github.com/tuoaccount
