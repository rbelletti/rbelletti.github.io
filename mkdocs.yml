site_name: Riccardo Belletti | Portfolio
site_url: https://rbelletti01.github.io/

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - attr_list # Permette di ridimensionare le immagini al volo

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/riccardobelletti01
    - icon: fontawesome/brands/github
      link: https://github.com/rbelletti01
